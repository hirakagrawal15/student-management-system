<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Student Register</h1>
  <dl class="stats" aria-live="polite">
    <div><dt>Students</dt><dd id="st-count">0</dd></div>
    <div><dt>Average marks</dt><dd id="st-avg">–</dd></div>
    <div><dt>Top scorer</dt><dd id="st-top">–</dd></div>
  </dl>
</header>

<main class="layout">
  <section class="panel" aria-labelledby="form-title">
    <h2 id="form-title">Add student</h2>
    <form id="form" novalidate>
      <input type="hidden" id="id">
      <label>Full name
        <input id="name" name="name" autocomplete="off" required>
        <small class="err" data-for="name"></small>
      </label>
      <div class="row">
        <label>Roll no.
          <input id="roll_no" name="roll_no" autocomplete="off" required>
          <small class="err" data-for="roll_no"></small>
        </label>
        <label>Class
          <input id="class" name="class" placeholder="e.g. 10-A" autocomplete="off" required>
          <small class="err" data-for="class"></small>
        </label>
      </div>
      <div class="row">
        <label>Marks (0–100)
          <input id="marks" name="marks" type="number" min="0" max="100" step="0.1" required>
          <small class="err" data-for="marks"></small>
        </label>
        <label>Contact
          <input id="contact" name="contact" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" required>
          <small class="err" data-for="contact"></small>
        </label>
      </div>
      <div class="actions">
        <button type="submit" id="save" class="primary">Add student</button>
        <button type="button" id="cancel" class="ghost" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section class="ledger" aria-labelledby="list-title">
    <div class="ledger-head">
      <h2 id="list-title">All students</h2>
      <input id="search" type="search" placeholder="Search by name or roll no." aria-label="Search students">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Roll no.</th><th>Name</th><th>Class</th><th>Marks</th><th>Contact</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden></p>
    </div>
  </section>
</main>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div class="actions">
    <button id="confirm-yes" class="danger">Delete student</button>
    <button id="confirm-no" class="ghost">Keep student</button>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
